name: 构建并部署 DSL2 网站到 GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: 校验、测试与构建
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出源码
        uses: actions/checkout@v6

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: 按锁文件安装依赖
        run: pnpm install --frozen-lockfile

      - name: 校验公开数据、类型、格式与静态构建
        run: pnpm verify

      - name: 安装浏览器测试环境
        run: pnpm exec playwright install --with-deps chromium

      - name: 执行桌面与移动端浏览器验收
        run: pnpm test:e2e

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上传静态网站产物
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    name: 发布到 scdoudizhu.com
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 部署 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
